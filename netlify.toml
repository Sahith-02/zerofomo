[build]
  publish = "dist"
  command = "npm run build"

# Aggressive image caching and optimization
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Vary = "Accept-Encoding"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Vary = "Accept-Encoding"

[[headers]]
  for = "*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Vary = "Accept-Encoding"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Vary = "Accept-Encoding"

[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Vary = "Accept-Encoding"

# Enable compression for all assets
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"

# Preload critical images (update these paths to your most important images)
[[headers]]
  for = "/"
  [headers.values]
    Link = '''
    </assets/banner.jpg>; rel=preload; as=image; crossorigin,
    </assets/logo.png>; rel=preload; as=image; crossorigin,
    </assets/banner__1.png>; rel=preload; as=image; crossorigin
    '''

# Enable processing optimizations
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true

# Enable edge handlers for faster delivery
[build.environment]
  NODE_ENV = "production"

# Netlify Large Media (for automatic image optimization)
[[plugins]]
  package = "@netlify/plugin-gatsby"

# Enable automatic image transformations
[build.processing.images]
  compress = true